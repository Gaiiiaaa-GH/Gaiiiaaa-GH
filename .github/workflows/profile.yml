name: Profile cards

# Regenerates the snake and the language card, then force-pushes them to the
# `output` branch so main's history stays clean.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Sweeps the graph column by column (snk's solver wanders outside the grid)
      - name: Snake
        run: python3 .github/scripts/snake.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&locale=fr&hide_border=true&bg_color=00000000&title_color=E5B95C&text_color=C9D1D9
          path: dist/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&locale=fr&hide_border=true&bg_color=00000000&title_color=A8782A&text_color=24292F
          path: dist/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update profile cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" output
